name: Build + Deploy

on:
  # Ship on a deliberate GitHub Release, not on every push to main — a merge to main stages
  # content; a published release is the actual "make this live" signal.
  release:
    types: [published]
  # Dispatched by T4.1.1's cross-repo workflows after a docs source repo publishes new content:
  # `gh workflow run "Build + Deploy" --repo w6w-io/docs`. This literal (both the "Build + Deploy"
  # name above and this trigger) is the calling interface — do not rename either.
  workflow_dispatch:

# Supersede an in-progress run when a newer one starts on the same ref. A docs rebuild has no
# partial-application hazard, so superseding an in-flight run is the right default.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    # Fork guard: this workflow reaches PRODUCTION and a personal fork carries none of the
    # secrets it needs, so on a fork it fails loudly on every push instead of doing nothing.
    # Mirrors every other deploy workflow in this codebase.
    #
    # NOTE the spelling: every sibling repo in this workspace follows the `w6w-io/w6w-*`
    # pattern, but this one does not — the GitHub repo is simply `w6w-io/docs`. The Cloudflare
    # Pages *project* below IS named `w6w-docs`; don't conflate the two when editing this guard.
    if: github.repository == 'w6w-io/docs'
    name: Type-check + build + deploy
    runs-on: ubuntu-latest
    steps:
      # The docs repo is checked out into `docs/` and its six source repos beside it, so the
      # importer's root is the common parent (`$GITHUB_WORKSPACE/sources`).
      - uses: actions/checkout@v6
        with:
          path: sources/docs

      # Install pnpm BEFORE Node so the Node action's pnpm cache can resolve the store path.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: sources/docs/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: sources/docs/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: sources/docs

      # Keeps T2.1.1's vendored branding tokens from drifting after this run. Not optional, and
      # never allowed to soft-fail — a drifted token set fails the build, not just a warning.
      - name: Check vendored tokens are current
        run: pnpm check:tokens
        working-directory: sources/docs

      # D-7: the source repos are private, so the default workflow token (scoped to this repo only) cannot
      # read them and no personal token is used. Mint a GitHub App installation token scoped to exactly the
      # six repos the importer reads.
      - name: Mint source-repo token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: w6w-io
          repositories: w6w-core,w6w-server,w6w-wrappers,w6w-studio,w6w-apps,w6w-ui

      # Full history (fetch-depth 0): the importer stamps each page with its source file's last
      # commit date and refuses a dirty listed file.
      - name: Checkout core
        uses: actions/checkout@v6
        with:
          repository: w6w-io/w6w-core
          token: ${{ steps.app-token.outputs.token }}
          path: sources/core
          fetch-depth: 0
      - name: Checkout server
        uses: actions/checkout@v6
        with:
          repository: w6w-io/w6w-server
          token: ${{ steps.app-token.outputs.token }}
          path: sources/server
          fetch-depth: 0
      - name: Checkout wrappers
        uses: actions/checkout@v6
        with:
          repository: w6w-io/w6w-wrappers
          token: ${{ steps.app-token.outputs.token }}
          path: sources/wrappers
          fetch-depth: 0
      - name: Checkout studio
        uses: actions/checkout@v6
        with:
          repository: w6w-io/w6w-studio
          token: ${{ steps.app-token.outputs.token }}
          path: sources/studio
          fetch-depth: 0
      - name: Checkout apps
        uses: actions/checkout@v6
        with:
          repository: w6w-io/w6w-apps
          token: ${{ steps.app-token.outputs.token }}
          path: sources/apps
          fetch-depth: 0
      - name: Checkout ui
        uses: actions/checkout@v6
        with:
          repository: w6w-io/w6w-ui
          token: ${{ steps.app-token.outputs.token }}
          path: sources/ui
          fetch-depth: 0

      - name: Import docs from the source repos
        run: node src/lib/import-docs.ts --root "$GITHUB_WORKSPACE/sources"
        working-directory: sources/docs

      - name: Build
        run: pnpm build
        working-directory: sources/docs

      # Deploy on the two triggers that mean "ship this": a published release (ref is the
      # release tag, e.g. `refs/tags/v1.2.3` — not `refs/heads/main`, so no branch check applies
      # there), or a workflow_dispatch — which T4.1.1's cross-repo callers always send with
      # `--ref main`, so THAT trigger still gets the branch check. A PR build (there is no
      # `pull_request` trigger on this workflow at all) must never deploy.
      # `wrangler-action@v3`'s own default (3.90.0) fails ALL Pages deploys against this
      # account's API token with "Authentication error [code: 10000]" -- reproduced with two
      # different, otherwise-working tokens, so it's not a token-scope problem. wrangler 4.127.1
      # deploys the exact same tree with the exact same token with no error. Pin explicitly
      # rather than trust the action's default.
      - name: Deploy
        if: |
          github.event_name == 'release' ||
          (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.127.1"
          workingDirectory: sources/docs
          command: pages deploy dist --project-name=w6w-docs
